<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--경로는 현재 여린 html 파일을 기준으로 함
    1. 절대 경로: 최상위(가장 바깥 폴더)까지 간 다음 가져오는 것
                 /(최상위 폴더에서)img(불러올 폴더)/hwayeon.jpg(불러 올 파일)
    2. 상대 경로: .(내 위치)/img(열 폴더)/hwayeon.jpg(불러 올 파일)
    -->
    <img src="/20250212/img/hwayeon.jpg" alt="">
    <img src="./img/hwayeon.jpg" alt="">
    <img src="../20250212/img/hwayeon.jpg" alt="">
</body>
</html>
