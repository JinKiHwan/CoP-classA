<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style</title>
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <!--html에 스타일을 입히는 방법
    1. 인라인 태그 안에 직접 css를 넣는 방법
    2. html 안에 선언하여 집어넣는 방법
    3. css 파일에서 Import(가장 권장되는 방법)
    *기본적으로 html은 일정 스타일을 가지고 있다. 브라우저마다 상이.
     하여 기본 스타일을 싹 지우고 작성함이 좋다.-->
    <h1 class="gaga" id="baba">뿡뿡</h1>
    <!--tag 선언, class, id
    id 값은 고유 명사이기 때문에 중복되어서는 X
    우선 순위가 있는데, 이걸 무시하는 건 !important-->

    <div class="box">안녕하세요?</div>
    <!--div: 막 쓸 수 있는 아무튼 박스. 모르겠다 싶으면 div!-->
  </body>
</html>
