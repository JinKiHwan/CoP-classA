  <body>
    <div class="wrap">
      <a href="/20250319/index.html">홈으로</a>
      <h1>회사개요</h1>
      <div class="img">
        <img src="./img/practice_img.gif" alt="이미지를 표시할 수 없습니다." />
      </div>
      <table class="table">
        <tr>
          <th>기업명</th>
          <td><p>(주)녹십자</p></td>
        </tr>
        <tr>
          <th>설립일</th>
          <td><p>1967년 10월 5일</p></td>
        </tr>
        <tr>
          <th>상장일</th>
          <td><p>1978년 8월 28일</p></td>
        </tr>
        <tr>
          <th>대표이사</th>
          <td><p>허일서 회장, 조순태 사장, 이병건 사장</p></td>
        </tr>
        <tr>
          <th>대표 업종</th>
          <td><p>의약품 제조 및 판매 등</p></td>
        </tr>
      </table>
      <p id="text">
        지난 반세기 동안 국내 생명공학 산업을 선도해 왔던 녹십자가 이제 인류
        모두의 행복한 내일을 위한 <span>'건강산업의 글로벌 리더'</span>로 새롭게
        거듭나고 있습니다. 이를 위해 녹십자는 창의와 도전의 정신을 바탕으로
        녹색의 집자가 의미하는 <span>봉사와 배려, 정도와 정의</span>를 지키고
        <span>인간을 존중</span>할 것을 약속합니다.
      </p>
